# git-cliff builds the body of each GitHub Release from the Conventional
# Commits. The notes live in the Release only: no CHANGELOG.md is committed.
# `.github/workflows/docker-publish.yml` runs it with `--current` on the tag
# being released.
[changelog]
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope and commit.scope != "deps" %}**{{ commit.scope }}**: {% endif %}{{ commit.message | split(pat="\n") | first | upper_first }}
{%- endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
# Drops the 400-odd messages inherited from the upstream template, which predate
# the convention, and the merge or revert messages git writes itself.
filter_unconventional = true
# Drops whatever no parser below claims, instead of printing it ungrouped.
filter_commits = true
# Only final `vX.Y.Z` tags delimit a release.
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
# The first parser that matches wins, which is why breaking changes come before
# `feat` and `fix`, and dependencies before the `chore` they would fall into.
# Groups are sorted alphabetically, so the `<!-- N -->` prefixes set the display
# order; `striptags` removes them from the output.
commit_parsers = [
  { message = "^[a-z]+(\\(.+\\))?!:", group = "<!-- 0 -->Breaking changes" },
  { message = "^feat", group = "<!-- 1 -->Features" },
  { message = "^fix", group = "<!-- 2 -->Bug fixes" },
  { message = "^perf", group = "<!-- 3 -->Performance" },
  { message = "^refactor", group = "<!-- 4 -->Refactoring" },
  { message = "^chore\\(deps", group = "<!-- 5 -->Dependencies" },
  { message = ".*", skip = true },
]
protect_breaking_commits = true
sort_commits = "oldest"
