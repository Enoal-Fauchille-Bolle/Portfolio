server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Le blog « Pensieve », hérité du template d'origine, a été supprimé. Sans
    # cette règle, le try_files ci-dessous servirait la page d'accueil en 200
    # sous les anciennes URL indexées, au lieu d'un 404 ou d'une redirection.
    location /pensieve {
        # Réponse relative (Location: /) plutôt qu'absolue : nginx est derrière
        # un reverse proxy qui termine le TLS, il ne voit donc que du http et
        # construirait sinon une redirection vers http://, avec un aller-retour
        # supplémentaire pour revenir en https.
        absolute_redirect off;
        return 301 /;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
