server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Réponses relatives (Location: /…) plutôt qu'absolues : nginx est derrière un
    # reverse proxy qui termine le TLS, il ne voit donc que du http et construirait
    # sinon des redirections vers http://, avec un aller-retour supplémentaire pour
    # revenir en https. Au niveau du serveur, la directive couvre aussi les
    # redirections que nginx ajoute lui-même pour un slash final manquant —
    # notamment `/en`, l'URL de la version anglaise que l'on partage à la main.
    absolute_redirect off;

    # L'image nginx officielle livre `gzip` commenté : sans ce bloc, les ~450 Ko de
    # JavaScript et le HTML (25 Ko, feuille de style styled-components incluse)
    # partent en clair sur le réseau. Le texte se comprime d'un facteur 3 à 4.
    # `gzip_vary` ajoute `Vary: Accept-Encoding`, indispensable dès qu'un cache
    # intermédiaire (le reverse proxy en amont) stocke la réponse.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        application/manifest+json
        image/svg+xml;

    # En-têtes par défaut du serveur. Sans `Cache-Control`, le navigateur applique
    # une heuristique : il revalide des fichiers pourtant immuables et, à
    # l'inverse, garde parfois un HTML périmé. La valeur prudente (revalidation
    # systématique) s'applique donc à tout — HTML, page-data, sw.js — et seuls les
    # fichiers dont le nom contient déjà une empreinte du contenu la remplacent
    # plus bas.
    #
    # Attention : `add_header` ne s'additionne pas. Un bloc `location` qui pose ses
    # propres en-têtes efface tous ceux hérités du serveur, d'où leur répétition.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cache-Control "public, max-age=0, must-revalidate" always;

    # Gatsby garantit un nom unique par contenu dans /static/ (images, polices) et
    # pour ses bundles JS de premier niveau : un an de cache, sans revalidation.
    location /static/ {
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # `sw.js` porte un nom stable et pilote le cache hors ligne : le figer
    # empêcherait toute mise à jour d'atteindre les visiteurs déjà venus. Une
    # location exacte l'emporte sur l'expression régulière ci-dessous, quel que
    # soit l'ordre de déclaration.
    location = /sw.js {
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    location ~* \.(?:js|css)$ {
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Le blog « Pensieve », hérité du template d'origine, a été supprimé. Sans
    # cette règle, le try_files ci-dessous servirait la page d'accueil en 200
    # sous les anciennes URL indexées, au lieu d'un 404 ou d'une redirection.
    location /pensieve {
        return 301 /;
    }

    # Le site n'est généré qu'en deux versions : le français sur `/` et l'anglais
    # sur `/en/`. `/fr` n'existe donc pas côté Gatsby, mais reste une URL que l'on
    # devine naturellement après avoir vu `/en`. On la renvoie vers la page
    # française correspondante en 301, ce qui transmet le référencement au lieu de
    # créer une page dupliquée.
    location = /fr {
        return 301 /;
    }

    location /fr/ {
        rewrite ^/fr/(.*)$ /$1 permanent;
    }

    # `try_files` se terminait par `/index.html`, un repli servi avec un statut 200 :
    # nginx ne produisait donc jamais de 404, et l'`error_page` ci-dessous n'a
    # jamais pu s'exécuter. Toute URL morte renvoyait la page d'accueil en 200, ce
    # qui la faisait passer pour un doublon aux yeux des moteurs et masquait les
    # liens cassés. `=404` rend la main à `error_page`, qui sert la vraie page.
    #
    # Le bloc /en/ est déclaré avant / : nginx retient le préfixe le plus long, un
    # visiteur perdu sur la version anglaise reçoit donc la page d'erreur anglaise.
    location /en/ {
        try_files $uri $uri/ =404;
        error_page 404 /en/404.html;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;

    location = /404.html {
        internal;
    }

    location = /en/404.html {
        internal;
    }
}
