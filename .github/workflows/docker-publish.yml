name: Docker Build & Release

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # The whole history: git-cliff reads it to write the Release notes.
          fetch-depth: 0

      - name: Set image name and version
        run: |
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV
          VERSION="${{ github.ref_name }}"
          echo "VERSION=${VERSION#v}" >> $GITHUB_ENV

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            GATSBY_UMAMI_WEBSITE_ID=${{ vars.GATSBY_UMAMI_WEBSITE_ID }}
            GATSBY_UMAMI_DOMAINS=${{ vars.GATSBY_UMAMI_DOMAINS }}
            GATSBY_UMAMI_HOST_URL=${{ vars.GATSBY_UMAMI_HOST_URL }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      # `--current` writes the notes for the checked-out tag alone, from the
      # previous `vX.Y.Z`. No `GITHUB_REPO`: it would switch on git-cliff's
      # GitHub integration, which calls the API unauthenticated for nothing the
      # template uses.
      - name: Write the Release notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --current --strip all
        env:
          OUTPUT: RELEASE_NOTES.md

      # Not `generate_release_notes`: GitHub builds those from merged pull
      # requests, and commits land on `main` directly.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
